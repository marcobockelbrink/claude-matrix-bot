# SonarQube analysis (local server, see .github/workflows/code-review.yml)
sonar.projectKey=marcobockelbrink_claude-matrix-bot
sonar.sources=.
sonar.exclusions=tests/**,coverage.xml
sonar.tests=tests
sonar.python.version=3.14
# Written by the "Unit tests with coverage" step before the scan.
sonar.python.coverage.reportPaths=coverage.xml

# Renovate pins images as "tag@digest" on purpose: the digest makes the build
# reproducible, the tag tells Renovate (and humans) which line to follow.
sonar.issue.ignore.multicriteria=tagdigest
sonar.issue.ignore.multicriteria.tagdigest.ruleKey=docker:S8431
sonar.issue.ignore.multicriteria.tagdigest.resourceKey=**/*
