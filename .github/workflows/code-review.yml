# Code review on the self-hosted runner (Mac): SonarQube scan + review by Claude Code.
# Setup: README in ~/Projekte/sonarqube-server on the runner machine.
# Needs: secrets SONAR_TOKEN and CLAUDE_CODE_OAUTH_TOKEN, the Claude GitHub App installed,
# a runner labelled "code-review", sonar-project.properties in the repo root.
name: Code-Review

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# A new push to the same PR cancels the outdated run (the runner is a single Mac)
concurrency:
  group: code-review-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sonarqube:
    runs-on: [self-hosted, macOS, code-review]
    # No PRs from forks: they would run foreign code on the Mac
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history for blame / "new code" detection

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@ba9859eae8dd6bd29e412f25ddbbef3d032000f4 # v8.2.2
        with:
          # The branch plugin needs the head SHA on GitHub PRs, otherwise the comment does not reach the PR
          args: >
            ${{ github.event_name == 'pull_request' && format('-Dsonar.scm.revision={0}', github.event.pull_request.head.sha) || '' }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: http://localhost:9000

  claude-review:
    runs-on: [self-hosted, macOS, code-review]
    if: >
      github.event_name == 'pull_request' && !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      id-token: write # auth for the Claude GitHub App (comments show up as claude[bot])
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # so Claude can read callers, tests and history

      - name: Claude-Review
        uses: anthropics/claude-code-action@cfc3eb22bfed5c26ef66e3223c982af27e4524de # v1.0.231
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR: ${{ github.event.pull_request.number }}

            Review diesen Pull Request als erfahrener Senior-Engineer. Antworte auf Deutsch.

            **1. Erst Kontext, dann Urteil.** Lies `CLAUDE.md` und vorhandene Beitragsregeln,
            dann Titel, Beschreibung und verlinkte Issues des PRs. Der Code ist ausgecheckt:
            Lies die geänderten Dateien ganz, nicht nur die Diff-Ausschnitte, dazu Aufrufer und Tests.

            **2. Prüfliste.** Geh diese sieben Kategorien durch:
            | Kategorie | Worauf |
            |---|---|
            | Korrektheit | Logikfehler, Off-by-one, None/null, Randfälle, Wettläufe |
            | Typsicherheit | falsche Typen, unsichere Casts, `any`, fehlende Prüfungen |
            | Projektmuster | Weicht die Änderung von den Konventionen des Repos ab (Benennung, Fehlerbehandlung, Aufbau)? |
            | Sicherheit | Injection, fehlende Auth-/Rechteprüfung, Geheimnisse, Path Traversal, SSRF |
            | Performance | N+1-Abfragen, fehlende Indizes, unbegrenzte Schleifen, Speicherlecks |
            | Vollständigkeit | fehlende Tests, fehlende Fehlerbehandlung, halbe Migrationen |
            | Wartbarkeit | toter Code, magische Zahlen, tiefe Verschachtelung, unklare Benennung |

            **3. Schweregrade.** Jeder Befund bekommt genau einen:
            - `kritisch` – Sicherheitslücke oder Datenverlust. Vor dem Merge beheben.
            - `hoch` – Bug oder Logikfehler, der im Betrieb auffallen wird. Sollte vor dem Merge weg.
            - `mittel` – Qualitätsmangel, Behebung empfohlen.
            - `niedrig` – Kleinigkeit, optional.

            **4. Sonderfälle.**
            - Nur Doku oder Konfiguration geändert: leichteres Review, Schwerpunkt Korrektheit.
            - Mehr als 50 Dateien: zuerst Quellcode, dann Tests, zuletzt Konfiguration.
            - Abhängigkeits-Updates: Changelog der neuen Fassung ansehen und auf Breaking Changes prüfen.

            **5. Was du nicht tust.**
            - Keine Stil- oder Formatierungshinweise und nichts, was ein Linter findet. SonarQube läuft im selben Workflow und meldet das regelbasiert.
            - Keine Tests, Builds oder Typprüfungen ausführen. Das erledigt ein eigener CI-Auftrag.
            - Nichts über Versionen, Release-Namen, Paketnamen oder CLI-Optionen behaupten, das du nicht
              mit `gh api` oder einer Websuche geprüft hast. Dein Wissen dazu ist veraltet.
            - Bewusst dokumentierte Entscheidungen (Code-Kommentare, `CLAUDE.md`) sind keine Befunde.
            - Lieber drei echte Befunde als zehn vermutete.

            **6. Ausgabe.**
            - Jeden Befund als Inline-Kommentar an der betroffenen Zeile, beginnend mit
              **kritisch**, **hoch**, **mittel** oder **niedrig**, mit konkretem Vorschlag.
            - Zum Schluss eine Zusammenfassung als PR-Kommentar mit
              `gh pr comment ${{ github.event.pull_request.number }} --edit-last --create-if-none --body "..."`,
              damit bei jedem Push derselbe Kommentar aktualisiert wird. Darin: ein Satz Gesamturteil
              und die Zahl der Befunde je Schweregrad. Ohne Befunde nur: Keine Befunde.
          claude_args: |
            --model claude-sonnet-5
            --setting-sources project
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh api:*),Bash(git log:*),Bash(git diff:*),Bash(git show:*),Read,Grep,Glob,WebFetch,WebSearch"
