# Code review on the self-hosted runner (Mac): SonarQube scan + review by Claude Code.
# Setup: README in ~/Projekte/sonarqube-server on the runner machine.
# Needs: secrets SONAR_TOKEN and CLAUDE_CODE_OAUTH_TOKEN, the Claude GitHub App installed,
# a runner labelled "code-review", sonar-project.properties in the repo root.
name: Code-Review

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# A new push to the same PR cancels the outdated run (the runner is a single Mac)
concurrency:
  group: code-review-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sonarqube:
    runs-on: [self-hosted, macOS, code-review]
    # No PRs from forks: they would run foreign code on the Mac.
    if: >
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history for blame / "new code" detection

      # Coverage for the quality gate's "coverage on new code". Python 3.14 as in
      # the image: onnxruntime (via faster-whisper) has no cp315 wheels yet.
      # Only on PRs opened by a human (the gate checks coverage on new code, and
      # bot PRs add none). Not on bot PRs or pushes to main, so a Renovate lock
      # update is not run here straight away. Once merged, the next human PR
      # runs those packages too: the real guard is Renovate's minimumReleaseAge.
      - name: Unit tests with coverage
        if: github.event_name == 'pull_request' && github.event.pull_request.user.type != 'Bot'
        run: |
          export PATH="/opt/homebrew/bin:$PATH"
          uv run --frozen -p 3.14 --with coverage \
            coverage run --source=. --omit='tests/*' -m unittest discover -s tests
          uv run --frozen -p 3.14 --with coverage coverage xml -o coverage.xml

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@59202af334b4ba7b5db01b701b8e79f8b3bef0f4 # v8.5.0
        with:
          # The branch plugin needs the head SHA on GitHub PRs, otherwise the comment does not reach the PR
          args: >
            ${{ github.event_name == 'pull_request' && format('-Dsonar.scm.revision={0}', github.event.pull_request.head.sha) || '' }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: http://localhost:9000

  claude-review:
    runs-on: [self-hosted, macOS, code-review]
    # No bot actors (Renovate, claude[bot] pushing a fix): claude-code-action refuses them,
    # and a red check would block Renovate's automerge on every update PR.
    if: >
      github.event_name == 'pull_request' && !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      !endsWith(github.actor, '[bot]')
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      id-token: write # auth for the Claude GitHub App (comments show up as claude[bot])
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # so Claude can read callers, tests and history

      - name: Claude-Review
        uses: anthropics/claude-code-action@6070f08d2b4766348e0acded463606a7b176417b # v1.0.279
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # No track_progress: it switches the action into tag mode, which requires this
          # file to be identical to the one on main -- a PR that changes it is then
          # skipped without a word. In automation mode Claude posts the comment itself
          # (see the instructions below).
          prompt: |
            REPO: ${{ github.repository }}
            PR: ${{ github.event.pull_request.number }}

            Review diesen Pull Request als erfahrener Senior-Engineer. Antworte auf Deutsch.

            **1. Erst Kontext, dann Urteil.** Lies `CLAUDE.md` und vorhandene Beitragsregeln,
            dann Titel, Beschreibung und verlinkte Issues des PRs. Der Code ist ausgecheckt:
            Lies die geänderten Dateien ganz, nicht nur die Diff-Ausschnitte, dazu Aufrufer und Tests.

            **2. Prüfliste.** Geh diese sieben Kategorien durch:
            | Kategorie | Worauf |
            |---|---|
            | Korrektheit | Logikfehler, Off-by-one, None/null, Randfälle, Wettläufe |
            | Typsicherheit | falsche Typen, unsichere Casts, `any`, fehlende Prüfungen |
            | Projektmuster | Weicht die Änderung von den Konventionen des Repos ab (Benennung, Fehlerbehandlung, Aufbau)? |
            | Sicherheit | Injection, fehlende Auth-/Rechteprüfung, Geheimnisse, Path Traversal, SSRF |
            | Performance | N+1-Abfragen, fehlende Indizes, unbegrenzte Schleifen, Speicherlecks |
            | Vollständigkeit | fehlende Tests, fehlende Fehlerbehandlung, halbe Migrationen. Ändert der PR Code-Verhalten und belegt kein Test im PR das neue Verhalten, ist das ein Befund `hoch` (gilt nicht für reine Doku- oder Konfigurationsänderungen) |
            | Wartbarkeit | toter Code, magische Zahlen, tiefe Verschachtelung, unklare Benennung |

            **3. Schweregrade.** Jeder Befund bekommt genau einen:
            - `kritisch` – Sicherheitslücke oder Datenverlust. Vor dem Merge beheben.
            - `hoch` – Bug oder Logikfehler, der im Betrieb auffallen wird, oder neues Verhalten ohne Test. Sollte vor dem Merge weg.
            - `mittel` – Qualitätsmangel, Behebung empfohlen.
            - `niedrig` – Kleinigkeit, optional.

            **4. Sonderfälle.**
            - Nur Doku oder Konfiguration geändert: leichteres Review, Schwerpunkt Korrektheit.
            - Mehr als 50 Dateien: zuerst Quellcode, dann Tests, zuletzt Konfiguration.
            - Abhängigkeits-Updates: Changelog der neuen Fassung ansehen und auf Breaking Changes prüfen.

            **5. Was du nicht tust.**
            - Keine Stil- oder Formatierungshinweise und nichts, was ein Linter findet. SonarQube läuft im selben Workflow und meldet das regelbasiert.
            - Keine Tests, Builds oder Typprüfungen ausführen. Das erledigt ein eigener CI-Auftrag.
            - Nichts über Versionen, Release-Namen, Paketnamen oder CLI-Optionen behaupten, das du nicht
              mit `gh api` oder einer Websuche geprüft hast. Dein Wissen dazu ist veraltet.
            - Bewusst dokumentierte Entscheidungen (Code-Kommentare, `CLAUDE.md`) sind keine Befunde.
            - Lieber drei echte Befunde als zehn vermutete.

            **6. Gegenprüfung, bevor du etwas schreibst.**
            Versuche jeden Befund zu widerlegen: Lies Aufrufer, Tests, vorgelagerte Prüfungen und
            Doku, die ihn entkräften könnten. Inline bleibt nur, was danach mit einem konkreten
            Fehlerszenario steht (welche Eingabe oder welcher Zustand führt zu welchem falschen
            Ergebnis). Was du widerlegst, fällt weg. Was du weder bestätigen noch widerlegen
            kannst, kommt nicht inline, sondern als Liste „unsicher“ in die Zusammenfassung.
            Ausnahme fehlender Test: Hier genügt als Szenario, welches neue Verhalten ungeprüft
            bleibt. Widerlegt ist er nur, wenn ein Test im PR dieses Verhalten tatsächlich prüft.
            Den Kommentar an die geänderte Codezeile setzen, nicht an eine Testdatei.

            **7. Ausgabe.**
            - Jeden Befund als Inline-Kommentar an der betroffenen Zeile, beginnend mit
              **kritisch**, **hoch**, **mittel** oder **niedrig**, mit Fehlerszenario und konkretem Vorschlag.
            - Betrifft die Korrektur nur die kommentierten Zeilen und ist sie höchstens etwa
              10 Zeilen lang, schreib sie als ```suggestion-Block, damit man sie mit einem Klick
              übernehmen kann. Der Block ersetzt den ganzen kommentierten Zeilenbereich; bei
              mehreren Zeilen den Kommentar über Start- und Endzeile setzen. Ein Vorschlag muss
              für sich allein funktionieren: Braucht er weitere Änderungen an anderer Stelle (Import,
              zu löschende Zeilen, neue Hilfsfunktion), schreib keinen suggestion-Block, sondern
              beschreib die Korrektur. Prüfe vor dem Posten, dass der Code nach dem Ersetzen genau
              dieses Zeilenbereichs korrekt wäre (keine doppelten oder fehlenden Zeilen).
            - **Immer** zum Schluss eine Zusammenfassung an den PR schreiben, auch bei null Befunden:
              `gh pr comment ${{ github.event.pull_request.number }} --edit-last --create-if-none --body '...'`
              (aktualisiert bei jedem Push denselben Kommentar). Inhalt: ein Satz Gesamturteil,
              die Zahl der Befunde je Schweregrad und, falls vorhanden, die Liste „unsicher“
              mit Datei:Zeile und je einem Satz. Nur wenn es weder Befunde noch Unsicheres gibt,
              genau: Keine Befunde. Den Text in einfachen Anführungszeichen übergeben (--body '...'),
              damit Backticks und $ nicht von der Shell ausgewertet werden; im Text selbst keine
              einfachen Anführungszeichen verwenden.
              Ein stummer Lauf ist ein fehlgeschlagener Lauf -- dieser Schritt darf nie entfallen.
          claude_args: |
            --model claude-opus-5-5
            --setting-sources project
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh api:*),Bash(git log:*),Bash(git diff:*),Bash(git show:*),Read,Grep,Glob,WebFetch,WebSearch"
