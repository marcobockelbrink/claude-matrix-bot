# @claude in issues and PRs: follow-up questions on a review, explanations or small changes.
# Runs on the self-hosted runner (Mac). Only users with write access can trigger Claude;
# the action checks that itself. Needs: secret CLAUDE_CODE_OAUTH_TOKEN, Claude GitHub App installed.
name: Claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: [self-hosted, macOS, code-review]
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write # auth for the Claude GitHub App
      actions: read # so Claude can read CI results on the PR
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Claude
        uses: anthropics/claude-code-action@cfc3eb22bfed5c26ef66e3223c982af27e4524de # v1.0.231
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --model claude-sonnet-5
