version: 2
updates:
  # pyproject.toml + uv.lock
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      python-deps:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      # One PR for all actions: codeql-action/init and /analyze must move
      # together, separate PRs for them fail CodeQL with a version mismatch.
      actions:
        patterns: ["*"]
