services:
  bot:
    build: .
    container_name: ha-matrix-bot
    env_file: .env
    ports:
      # Webhook for proactive notifications from Home Assistant automations.
      - "8321:8321"
    volumes:
      # Persist the Matrix E2E store so the bot keeps its device identity and
      # encrypted-session keys across restarts.
      - ./store:/app/store
      # Agent memory, bot state, and the Whisper model cache.
      - ./data:/app/data
    restart: unless-stopped
