apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ha-matrix-bot.fullname" . }}
  labels:
    {{- include "ha-matrix-bot.labels" . | nindent 4 }}
spec:
  # The bot holds a Matrix device identity and a persistent agent session —
  # never run more than one replica.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "ha-matrix-bot.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ha-matrix-bot.selectorLabels" . | nindent 8 }}
      {{- if and (not .Values.secrets.existingSecret) .Values.secrets.values }}
      annotations:
        checksum/secret: {{ .Values.secrets.values | toYaml | sha256sum }}
      {{- end }}
    spec:
      securityContext:
        # Image runs as uid 1000 ("bot"); make the PVCs writable for it.
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: bot
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          envFrom:
            - secretRef:
                name: {{ include "ha-matrix-bot.secretName" . }}
          env:
            - name: BOT_LANG
              value: {{ .Values.config.botLang | quote }}
            - name: TZ
              value: {{ .Values.config.tz | quote }}
            - name: WEBHOOK_PORT
              value: {{ .Values.config.webhookPort | quote }}
            - name: BRIEFING_TIME
              value: {{ .Values.config.briefingTime | quote }}
            - name: WHISPER_MODEL
              value: {{ .Values.config.whisperModel | quote }}
            - name: CONFIRM_DESTRUCTIVE
              value: {{ .Values.config.confirmDestructive | quote }}
            {{- with .Values.config.notifyRoom }}
            - name: NOTIFY_ROOM
              value: {{ . | quote }}
            {{- end }}
            {{- if .Values.signal.enabled }}
            - name: SIGNAL_API_URL
              value: "http://{{ include "ha-matrix-bot.fullname" . }}-signal:8080"
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.config.webhookPort }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 60
            periodSeconds: 60
            failureThreshold: 3
          volumeMounts:
            - name: store
              mountPath: /app/store
            - name: data
              mountPath: /app/data
            # Writable paths needed despite the read-only root filesystem.
            - name: outbox
              mountPath: /app/outbox
            - name: home
              mountPath: /home/bot
            - name: tmp
              mountPath: /tmp
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: store
          persistentVolumeClaim:
            claimName: {{ include "ha-matrix-bot.fullname" . }}-store
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "ha-matrix-bot.fullname" . }}-data
        - name: outbox
          emptyDir: {}
        - name: home
          emptyDir: {}
        - name: tmp
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
