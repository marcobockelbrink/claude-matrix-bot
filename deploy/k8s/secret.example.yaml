# Copy to secret.yaml, fill in, then: kubectl apply -f secret.yaml
# (secret.yaml is for your eyes only — never commit it.)
apiVersion: v1
kind: Secret
metadata:
  name: ha-matrix-bot
  namespace: ha-matrix-bot
stringData:
  # Claude auth — set ONE of the two:
  CLAUDE_CODE_OAUTH_TOKEN: "sk-ant-oat01-..."
  # ANTHROPIC_API_KEY: "sk-ant-..."

  HA_BASE_URL: "https://your-home-assistant.example.com"
  HA_TOKEN: "your-long-lived-access-token"

  MATRIX_HOMESERVER: "https://matrix.org"
  MATRIX_USER: "@yourbot:matrix.org"
  MATRIX_PASSWORD: "the-bot-accounts-password"
  MATRIX_ALLOWED_USERS: "@you:matrix.org,@partner:matrix.org"

  WEBHOOK_TOKEN: "generate-something-long-and-random"

  # Optional Signal channel (see ../../README.md):
  # SIGNAL_API_URL: "http://ha-matrix-bot-signal:8080"
  # SIGNAL_NUMBER: "+49..."
  # SIGNAL_ALLOWED_NUMBERS: "+49...,+49..."
  # SIGNAL_NOTIFY: "+49..."
